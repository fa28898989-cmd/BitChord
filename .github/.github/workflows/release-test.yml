name: Release Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create signing key
        run: |
          keytool -genkeypair -keystore bitchord-release.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=BitChord"
          printf "storeFile=bitchord-release.jks\nstorePassword=android123\nkeyAlias=key0\nkeyPassword=android123\n" > keystore.properties

      - run: chmod +x gradlew

      - run: ./gradlew :app:assembleProdRelease

      - uses: actions/upload-artifact@v4
        with:
          name: bitchord-release
          path: app/build/outputs/apk/prod/release/*.apk
